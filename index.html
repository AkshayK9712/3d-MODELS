<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akshay K | 3D models for VirtuChemLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bench: #e8eeec;
    --panel: #f6f9f8;
    --ink: #12262b;
    --ink-soft: #4a6168;
    --line: #c7d3d0;
    --glass: #0e7c7b;
    --indicator: #c8236b;
    --stage-top: #f9fbfa;
    --stage-bottom: #d3dedb;
    --display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
    --text: "Newsreader", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bench);
    color: var(--ink);
    font-family: var(--text);
    font-size: 18px;
    line-height: 1.55;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--indicator); outline-offset: 2px; }

  header.top {
    max-width: 1280px;
    margin: 0 auto;
    padding: 28px 24px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 32px;
    align-items: end;
    justify-content: space-between;
  }
  header.top h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(30px, 4.6vw, 52px);
    line-height: 1.04;
    letter-spacing: -0.02em;
  }
  header.top p {
    margin: 0;
    max-width: 38ch;
    color: var(--ink-soft);
  }
  header.top p a { color: var(--glass); text-underline-offset: 3px; }

  /* Stage */
  .stage-wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
  .stage {
    position: relative;
    height: clamp(380px, 64vh, 640px);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    background: linear-gradient(180deg, var(--stage-top), var(--stage-bottom));
  }
  .stage canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  .stage canvas:active { cursor: grabbing; }
  .info {
    position: absolute;
    left: 20px; bottom: 18px;
    max-width: min(420px, calc(100% - 40px));
    pointer-events: none;
  }
  .info h2 {
    margin: 0;
    font-family: var(--display);
    font-size: clamp(24px, 3vw, 34px);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .info .desc { margin: 6px 0 0; color: var(--ink-soft); font-size: 17px; }
  .info .meta { margin: 8px 0 0; font-size: 15px; color: var(--ink-soft); }
  .info .meta b { color: var(--glass); font-weight: 500; }
  .tools {
    position: absolute;
    top: 14px; right: 14px;
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
  }
  .tools button, .tools a {
    font: 500 15px/1 var(--display);
    padding: 9px 13px;
    background: rgba(246, 249, 248, 0.92);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 4px;
    cursor: pointer;
    text-decoration: none;
  }
  .tools button:hover, .tools a:hover { border-color: var(--glass); }
  .tools button[aria-pressed="true"] { background: var(--glass); color: #fff; border-color: var(--glass); }
  .status {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 24px;
    background: rgba(246, 249, 248, 0.82);
    font-family: var(--display);
    font-size: 18px;
  }
  .status.show { display: flex; }
  .status.error { color: var(--indicator); }

  /* Shelf */
  .shelf { max-width: 1280px; margin: 0 auto; padding: 32px 24px 64px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .filters button {
    font: 500 16px/1 var(--display);
    padding: 10px 14px;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
  }
  .filters button:hover { border-color: var(--glass); }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .filters .count { color: var(--ink-soft); margin-left: 6px; font-weight: 400; }
  .filters button[aria-pressed="true"] .count { color: #a9bfc4; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
  }
  .card {
    appearance: none;
    text-align: left;
    padding: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    color: inherit;
    font: inherit;
  }
  .card:hover { border-color: var(--glass); }
  .card[aria-current="true"] { border-color: var(--indicator); box-shadow: 0 0 0 2px var(--indicator); }
  .card .thumb {
    aspect-ratio: 1 / 1;
    background: linear-gradient(180deg, var(--stage-top), var(--stage-bottom));
    display: grid; place-items: center;
  }
  .card .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .card .thumb .wait { font: 500 14px var(--display); color: var(--ink-soft); }
  .card .label { padding: 10px 12px 12px; border-top: 1px solid var(--line); }
  .card .label strong { display: block; font: 600 17px/1.2 var(--display); }
  .card .label span { font-size: 15px; color: var(--ink-soft); }

  footer { max-width: 1280px; margin: 0 auto; padding: 0 24px 40px; color: var(--ink-soft); font-size: 15px; }

  @media (max-width: 640px) {
    .tools { top: 10px; right: 10px; }
    .info { left: 14px; bottom: 12px; }
    .info .desc { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>

<header class="top">
  <h1>3D models for VirtuChemLab</h1>
  <p><span id="count">0</span> props I modelled for a virtual chemistry lab. Drag to rotate, scroll to zoom. Source on <a href="https://github.com/AkshayK9712/3d-MODELS" target="_blank" rel="noopener">GitHub</a>.</p>
</header>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <div class="tools">
      <button id="btnRotate" aria-pressed="true" type="button">Auto-rotate</button>
      <button id="btnPaint" aria-pressed="true" type="button">Glass effect</button>
      <button id="btnWire" aria-pressed="false" type="button">Wireframe</button>
      <button id="btnReset" type="button">Reset view</button>
      <a id="gh" href="#" target="_blank" rel="noopener">View on GitHub</a>
    </div>
    <div class="info">
      <h2 id="title"></h2>
      <p class="desc" id="desc"></p>
      <p class="meta" id="meta"></p>
    </div>
    <div class="status" id="status" role="status"></div>
  </div>
</div>

<main class="shelf">
  <div class="filters" id="filters" role="group" aria-label="Filter models by category"></div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  Models load directly from the GitHub repository, so new files you add there appear here once you list them in the <code>MODELS</code> array.
</footer>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- Where the files live ----------
   Default: raw files straight from your GitHub repo.
   If you put this index.html inside the repo and serve it with GitHub Pages,
   open it with ?local in the URL to load the files from the same folder. */
const REPO_RAW = 'https://raw.githubusercontent.com/AkshayK9712/3d-MODELS/main/';
const REPO_PAGE = 'https://github.com/AkshayK9712/3d-MODELS/blob/main/';
const BASE = new URLSearchParams(location.search).has('local') ? './' : REPO_RAW;

/* ---------- Your models ---------- */
const MODELS = [
  { file: 'Burette.gltf', name: 'Burette', cat: 'Glassware', desc: 'Graduated tube with a stopcock, used to run out liquid drop by drop in titrations.' },
  { file: 'Beaker-Low.gltf', name: 'Low-form beaker', cat: 'Glassware', desc: 'Wide, short beaker for mixing, heating and holding solutions.' },
  { file: 'GlassBeaker_100ml.gltf', name: 'Glass beaker, 100 ml', cat: 'Glassware', desc: 'Standard 100 ml glass beaker.' },
  { file: 'GlassBeaker_150ml.gltf', name: 'Glass beaker, 150 ml', cat: 'Glassware', desc: 'Standard 150 ml glass beaker.' },
  { file: 'Graduated_Cylinder_100ml.gltf', name: 'Graduated cylinder, 100 ml', cat: 'Glassware', desc: 'Tall measuring cylinder for reading liquid volumes.' },
  { file: 'VolumetricFlask100ml.gltf', name: 'Volumetric flask', cat: 'Glassware', desc: 'Narrow-necked flask for making up solutions to an exact volume.' },
  { file: 'U-Tube.gltf', name: 'U-tube', cat: 'Glassware', desc: 'Bent glass tube used in gas and electrolysis experiments.' },

  { file: 'Pasteurpipette.gltf', name: 'Pasteur pipette', cat: 'Pipettes', desc: 'Thin glass dropper for transferring small amounts of liquid.' },
  { file: 'PipetteSqueezeBall.gltf', name: 'Pipette squeeze ball', cat: 'Pipettes', desc: 'Rubber bulb that draws liquid up into a pipette.' },
  { file: 'BallPippetteLabelnew.gltf', name: 'Ball pipette with label', cat: 'Pipettes', desc: 'Pipette fitted with a squeeze ball and a printed label.' },

  { file: 'RetortStand2.gltf', name: 'Retort stand', cat: 'Stands and supports', desc: 'Upright rod and base that holds clamps and glassware.' },
  { file: 'Tripod.gltf', name: 'Tripod', cat: 'Stands and supports', desc: 'Three-legged stand that holds apparatus over a burner.' },
  { file: 'FunnelStand.gltf', name: 'Funnel stand', cat: 'Stands and supports', desc: 'Holder that keeps a funnel upright during filtration.' },
  { file: 'Wiremesh.gltf', name: 'Wire gauze', cat: 'Stands and supports', desc: 'Mesh that spreads heat evenly under glassware.' },

  { file: 'DigitalMultimeterWIthCables.gltf', name: 'Digital multimeter with cables', cat: 'Electrical', desc: 'Handheld meter with probe cables for voltage and current readings.' },
  { file: 'Crocodile_clip.gltf', name: 'Crocodile clip', cat: 'Electrical', desc: 'Spring clip used to connect wires in a circuit.' },

  { file: 'PlasticFunnel.gltf', name: 'Plastic funnel', cat: 'Tools and consumables', desc: 'Funnel for pouring liquids into narrow openings.' },
  { file: 'FilterPaper_new.gltf', name: 'Filter paper', cat: 'Tools and consumables', desc: 'Paper disc that separates solids from liquids.' },
  { file: 'Gas_Lighter.gltf', name: 'Gas lighter', cat: 'Tools and consumables', desc: 'Long-nosed lighter for starting a burner.' },
  { file: 'Presenter_remote.gltf', name: 'Presenter remote', cat: 'Tools and consumables', desc: 'Handheld clicker used to move through slides.' },

  { file: 'PlayerModel.fbx', name: 'Player model', cat: 'Character', desc: 'The character the learner plays in the lab.' }
];
MODELS.forEach(m => { m.ext = m.file.split('.').pop().toLowerCase(); });

/* ---------- Glass ----------
   Only glassware is changed: its glass parts get a clear, shiny glass material.
   Every other model, and every non-glass part of a glassware model (stoppers, rubber bulbs,
   labels, graduation marks, liquid), keeps the colours it already has. */
const GLASSWARE = new Set([
  'Burette.gltf', 'Beaker-Low.gltf', 'GlassBeaker_100ml.gltf', 'GlassBeaker_150ml.gltf',
  'Graduated_Cylinder_100ml.gltf', 'VolumetricFlask100ml.gltf', 'U-Tube.gltf', 'Pasteurpipette.gltf', 'BallPippetteLabelnew.gltf'
]);
/* Parts whose name matches this are NOT glass and keep their original material. */
const KEEP_ORIGINAL = /stopper|cork|lid|plug|cap\b|stopcock|tap|valve|key|rubber|bulb|teat|ball|label|graduat|scale|marking|print|decal|text|liquid|water|solution|fluid|reagent/i;

function makeGlass(orig) {
  const mat = new THREE.MeshPhysicalMaterial({
    color: 0xe4f4f3,
    transparent: true,
    opacity: 0.28,
    roughness: 0.02,
    metalness: 0,
    ior: 1.5,
    specularIntensity: 1,
    clearcoat: 1,
    clearcoatRoughness: 0.02,
    envMapIntensity: 2.2,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  if (orig) {
    if (orig.map) mat.map = orig.map;
    if (orig.normalMap) mat.normalMap = orig.normalMap;
    if (orig.alphaMap) mat.alphaMap = orig.alphaMap;
  }
  mat.name = (orig && orig.name) || '';
  return mat;
}

/* Build the glass materials once per model and keep the originals so you can switch back. */
function preparePaint(root, m) {
  const isGlassware = GLASSWARE.has(m.file);
  const own = new RegExp(m.file.replace(/\.[^.]+$/, '').replace(/[^a-z0-9]/gi, '.?'), 'ig');
  const seen = [];
  root.traverse(o => {
    if (!o.isMesh) return;
    const origs = Array.isArray(o.material) ? o.material : [o.material];
    const glass = origs.map(om => {
      const label = [o.name, om && om.name].filter(Boolean).join(' ').replace(own, '');
      const keep = !isGlassware || KEEP_ORIGINAL.test(label);
      seen.push((label.trim() || '(unnamed)') + (keep ? '  [kept]' : '  [glass]'));
      return keep ? om : makeGlass(om);
    });
    o.userData.orig = o.material;
    o.userData.paint = Array.isArray(o.material) ? glass : glass[0];
  });
  if (isGlassware) console.info('[glass] ' + m.file + ' parts:', seen);
  if (m.file === 'VolumetricFlask100ml.gltf') hideLiquid(root, own);
  if (m.file === 'Pasteurpipette.gltf') paintRubberYellow(root, own);
  if (COLOURS[m.file]) paintByName(root, own, COLOURS[m.file], m.file);
}

/* Colours for the gas lighter and the multimeter. Each part is matched by its mesh or material
   name; parts with no matching rule get the base colour. Always on, not tied to the Glass effect button. */
const mk = (hex, rough, metal, extra = {}) => ({ hex, rough, metal, ...extra });
const COLOURS = {
  'PipetteSqueezeBall.gltf': {
    base: mk(0xff7a1a, 0.6, 0),                        // everything orange...
    keepTextures: true,                                // ...but textured letters keep their black
    keepTransparent: true,                             // ...and see-through (glass) parts stay as they were
    parts: [
      [/glass|tube|stem|pipette|label|letter|text|mark|print|decal|number|ink|logo|scale|graduat/i, 'KEEP']
    ]
  },
  'Gas_Lighter.gltf': {
    base: mk(0xc62d28, 0.45, 0),                       // red plastic body
    parts: [
      [/nozzle|tube|barrel|neck|metal|tip|wand/i, mk(0xb4bcc2, 0.3, 0.9)],   // steel nozzle
      [/trigger|button|igniter|switch|lever/i, mk(0x1d2024, 0.5, 0)],        // black trigger
      [/spring|screw|ring|clip/i, mk(0x8e979d, 0.35, 0.9)]
    ]
  },
  'DigitalMultimeterWIthCables.gltf': {
    base: mk(0xf2b705, 0.45, 0),                       // yellow body
    keepTextures: true,                                // keep printed markings that live in textures
    parts: [
      [/label|mark|text|print|decal|number|symbol|scale|legend|logo|sticker|icon/i, 'KEEP'],   // marking parts stay as they were
      [/screen|display|lcd|glass/i, mk(0x9fd3b0, 0.2, 0, { emissive: 0x4fa56d })],
      [/holster|rubber|boot|cover|case/i, mk(0x2a2d31, 0.8, 0)],
      [/button|knob|dial|switch/i, mk(0x1d2024, 0.5, 0)],
      [/red/i, mk(0xc62d28, 0.5, 0)],                 // red cable / socket
      [/black|cable|wire|lead/i, mk(0x1d2024, 0.55, 0)],
      [/probe|plug|tip|pin|metal|jack|socket/i, mk(0xb4bcc2, 0.3, 0.9)]
    ]
  }
};
function paintByName(root, own, cfg, file) {
  const seen = [];
  root.traverse(o => {
    if (!o.isMesh) return;
    const origs = Array.isArray(o.material) ? o.material : [o.material];
    const mats = origs.map(om => {
      const label = [o.name, om && om.name].filter(Boolean).join(' ').replace(own, '');
      const hit = cfg.parts.find(([re]) => re.test(label));
      const spec = hit ? hit[1] : cfg.base;
      seen.push((label.trim() || '(unnamed)') + (hit ? (spec === 'KEEP' ? '  [kept original]' : '') : '  [base]'));
      if (spec === 'KEEP') return om;
      if (cfg.keepTransparent && om && (om.transparent || om.opacity < 1)) { seen[seen.length - 1] += '  [kept: see-through]'; return om; }
      const mat = new THREE.MeshStandardMaterial({ color: spec.hex, roughness: spec.rough, metalness: spec.metal });
      if (spec.emissive) { mat.emissive = new THREE.Color(spec.emissive); mat.emissiveIntensity = 0.6; }
      /* Parts with a texture keep it, so printed labels and markings stay visible; the colour tints the texture. */
      if (cfg.keepTextures && om && om.map) {
        mat.map = om.map;
        if (om.normalMap) mat.normalMap = om.normalMap;
        if (om.alphaMap) mat.alphaMap = om.alphaMap;
        if (om.transparent) { mat.transparent = true; mat.alphaTest = om.alphaTest || 0; }
        mat.side = om.side;
      }
      return mat;
    });
    const out = Array.isArray(o.material) ? mats : mats[0];
    o.material = out;
    o.userData.orig = out;
    o.userData.paint = out;
  });
  console.info('[colour] ' + file + ' parts:', seen);
}

/* Empty flask: hide any part that is the water/liquid. */
const LIQUID_NAME = /liquid|water|solution|fluid|reagent|content/i;
function hideLiquid(root, own) {
  root.traverse(o => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const label = [o.name, ...mats.map(x => x && x.name)].filter(Boolean).join(' ').replace(own, '');
    if (LIQUID_NAME.test(label)) o.visible = false;
  });
}

/* Pasteur pipette: the rubber end becomes yellow. Uses the part named rubber/bulb/teat/ball;
   if no part has such a name, the highest part (the end at the top) is taken as the rubber. */
const YELLOW_RUBBER = new THREE.MeshStandardMaterial({ color: 0xf2c200, roughness: 0.8, metalness: 0 });
function paintRubberYellow(root, own) {
  const meshes = [];
  root.traverse(o => { if (o.isMesh) meshes.push(o); });
  let targets = meshes.filter(o => /rubber|bulb|teat|ball|squeeze/i.test((o.name || '').replace(own, '')));
  if (!targets.length && meshes.length > 1) {
    const topY = o => new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3()).y;
    targets = [meshes.slice().sort((p, q) => topY(q) - topY(p))[0]];
  }
  targets.forEach(o => { o.material = YELLOW_RUBBER; o.userData.orig = YELLOW_RUBBER; o.userData.paint = YELLOW_RUBBER; });
  console.info('[rubber] yellow applied to:', targets.map(o => o.name || '(unnamed)'));
}

function applyPaint(root, on) {
  root.traverse(o => {
    if (o.isMesh && o.userData.paint) o.material = on ? o.userData.paint : o.userData.orig;
  });
  setWire(root, wire);
}
document.getElementById('count').textContent = MODELS.length;

/* ---------- Loading with a cache ---------- */
const gltfLoader = new GLTFLoader();
const fbxLoader = new FBXLoader();
const cache = new Map();

function loadModel(m) {
  if (cache.has(m.file)) return cache.get(m.file);
  const url = BASE + encodeURI(m.file);
  const p = new Promise((resolve, reject) => {
    const done = (obj) => { try { resolve(normalise(obj, m)); } catch (e) { reject(e); } };
    if (m.ext === 'fbx') fbxLoader.load(url, done, undefined, reject);
    else gltfLoader.load(url, g => done(g.scene), undefined, reject);
  });
  cache.set(m.file, p);
  p.catch(() => cache.delete(m.file));
  return p;
}

/* Centre the model and scale it to a common size so every model fits the stage. */
function normalise(obj, m) {
  preparePaint(obj, m);
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const scale = 2 / maxDim;
  obj.position.sub(center);
  const pivot = new THREE.Group();
  pivot.add(obj);
  pivot.scale.setScalar(scale);
  return { pivot, floorY: -(size.y / 2) * scale, triangles: countTriangles(obj) };
}

function countTriangles(obj) {
  let n = 0;
  obj.traverse(o => {
    if (o.isMesh && o.geometry) {
      const g = o.geometry;
      n += (g.index ? g.index.count : g.attributes.position.count) / 3;
    }
  });
  return Math.round(n);
}

/* ---------- Shared scene helpers ---------- */
function makeRenderer(canvas, w, h, dpr) {
  const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: !!canvas.dataset.thumb });
  r.setPixelRatio(dpr);
  r.setSize(w, h, false);
  r.setClearColor(0x000000, 0);
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.0;
  return r;
}
function addLights(scene, renderer) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  const key = new THREE.DirectionalLight(0xffffff, 1.4);
  key.position.set(3, 5, 4);
  scene.add(key);
}
function shadowDisc() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 4, 64, 64, 64);
  grad.addColorStop(0, 'rgba(18,38,43,0.35)');
  grad.addColorStop(1, 'rgba(18,38,43,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(2.6, 2.6),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false })
  );
  mesh.rotation.x = -Math.PI / 2;
  return mesh;
}

/* ---------- Main stage ---------- */
const stageEl = document.getElementById('stage');
const canvas = document.createElement('canvas');
stageEl.prepend(canvas);
const renderer = makeRenderer(canvas, stageEl.clientWidth, stageEl.clientHeight, Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
addLights(scene, renderer);
const camera = new THREE.PerspectiveCamera(38, stageEl.clientWidth / stageEl.clientHeight, 0.1, 100);
const HOME = new THREE.Vector3(2.6, 1.5, 3.4);
camera.position.copy(HOME);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.minDistance = 1.2;
controls.maxDistance = 9;
controls.autoRotate = !matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.autoRotateSpeed = 1.2;
const disc = shadowDisc();
scene.add(disc);

let current = null;
let wire = false;
let painted = true;

function setWire(root, on) {
  root.traverse(o => {
    if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach(mt => { if (mt) mt.wireframe = on; });
  });
}

const els = {
  title: document.getElementById('title'),
  desc: document.getElementById('desc'),
  meta: document.getElementById('meta'),
  gh: document.getElementById('gh'),
  status: document.getElementById('status')
};
function showStatus(text, isError) {
  els.status.textContent = text || '';
  els.status.classList.toggle('show', !!text);
  els.status.classList.toggle('error', !!isError);
}

let token = 0;
async function show(m) {
  const mine = ++token;
  els.title.textContent = m.name;
  els.desc.textContent = m.desc;
  els.meta.innerHTML = '';
  els.gh.href = REPO_PAGE + encodeURI(m.file);
  document.querySelectorAll('.card').forEach(c => c.setAttribute('aria-current', c.dataset.file === m.file ? 'true' : 'false'));
  showStatus('Loading ' + m.name + '…');
  try {
    const entry = await loadModel(m);
    if (mine !== token) return;
    if (current) scene.remove(current);
    current = entry.pivot;
    applyPaint(current, painted);
    scene.add(current);
    disc.position.y = entry.floorY - 0.002;
    resetView();
    els.meta.innerHTML = '<b>' + m.cat + '</b>, ' + m.file + ', ' + entry.triangles.toLocaleString() + ' triangles';
    showStatus('');
  } catch (err) {
    if (mine !== token) return;
    console.error('Removing ' + m.file + ' (could not load):', err);
    const i = MODELS.indexOf(m);
    removeModel(m);
    if (MODELS.length) return show(MODELS[Math.min(Math.max(i, 0), MODELS.length - 1)]);
  }
}
function resetView() {
  camera.position.copy(HOME);
  controls.target.set(0, 0, 0);
  controls.update();
}

new ResizeObserver(() => {
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}).observe(stageEl);

(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();

/* Controls */
const btnRotate = document.getElementById('btnRotate');
const btnWire = document.getElementById('btnWire');
btnRotate.setAttribute('aria-pressed', String(controls.autoRotate));
btnRotate.onclick = () => { controls.autoRotate = !controls.autoRotate; btnRotate.setAttribute('aria-pressed', String(controls.autoRotate)); };
btnWire.onclick = () => { wire = !wire; btnWire.setAttribute('aria-pressed', String(wire)); if (current) setWire(current, wire); };
document.getElementById('btnReset').onclick = resetView;
const btnPaint = document.getElementById('btnPaint');
btnPaint.onclick = () => {
  painted = !painted;
  btnPaint.setAttribute('aria-pressed', String(painted));
  if (current) applyPaint(current, painted);
  thumbQueue();
};

/* ---------- Shelf: filters + cards ---------- */
const filtersEl = document.getElementById('filters');
const gridEl = document.getElementById('grid');
let activeCat = 'All';

function buildFilters() {
  const cats = ['All', ...new Set(MODELS.map(m => m.cat))];
  if (!cats.includes(activeCat)) activeCat = 'All';
  filtersEl.replaceChildren();
  cats.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    const n = c === 'All' ? MODELS.length : MODELS.filter(m => m.cat === c).length;
    b.innerHTML = c + '<span class="count">' + n + '</span>';
    b.setAttribute('aria-pressed', String(c === activeCat));
    b.onclick = () => {
      activeCat = c;
      filtersEl.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      applyFilter();
    };
    filtersEl.appendChild(b);
  });
}
function applyFilter() {
  gridEl.querySelectorAll('.card').forEach(card => { card.hidden = !(activeCat === 'All' || card.dataset.cat === activeCat); });
}
buildFilters();

/* Drop a model whose file can't be loaded (missing from the repo, broken, etc.) */
function removeModel(m) {
  const i = MODELS.indexOf(m);
  if (i === -1) return;
  MODELS.splice(i, 1);
  m.card.remove();
  document.getElementById('count').textContent = MODELS.length;
  buildFilters();
  applyFilter();
  if (!MODELS.length) showStatus('Could not load any models. Check your internet connection and that the files exist in the repository.', true);
}

MODELS.forEach(m => {
  const card = document.createElement('button');
  card.type = 'button';
  card.className = 'card';
  card.dataset.file = m.file;
  card.dataset.cat = m.cat;
  card.setAttribute('aria-current', 'false');
  card.innerHTML =
    '<div class="thumb"><span class="wait">Loading</span></div>' +
    '<div class="label"><strong></strong><span></span></div>';
  card.querySelector('strong').textContent = m.name;
  card.querySelector('.label span').textContent = m.cat;
  card.onclick = () => {
    show(m);
    stageEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
  m.card = card;
  gridEl.appendChild(card);
});

/* ---------- Thumbnails: one hidden renderer, a couple of models at a time ---------- */
const TH = 360;
const tCanvas = document.createElement('canvas');
tCanvas.dataset.thumb = '1';
const tRenderer = makeRenderer(tCanvas, TH, TH, 1);
const tScene = new THREE.Scene();
addLights(tScene, tRenderer);
const tCam = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
tCam.position.set(2.6, 1.5, 3.4);
tCam.lookAt(0, 0, 0);

async function makeThumb(m) {
  if (!m.card.isConnected) return;
  const thumb = m.card.querySelector('.thumb');
  try {
    const entry = await loadModel(m);
    const prevParent = entry.pivot.parent; // the main stage may be showing this model
    applyPaint(entry.pivot, painted);
    tScene.add(entry.pivot);
    tRenderer.render(tScene, tCam);
    const url = tCanvas.toDataURL('image/png');
    if (prevParent) prevParent.add(entry.pivot); else tScene.remove(entry.pivot);
    const img = new Image();
    img.alt = '';
    img.src = url;
    thumb.replaceChildren(img);
  } catch (err) {
    console.error('Removing ' + m.file + ' (could not load):', err);
    const wasCurrent = m.card.getAttribute('aria-current') === 'true';
    removeModel(m);
    if (wasCurrent && MODELS.length) show(MODELS[0]);
  }
}
let thumbRun = 0;
async function thumbQueue() {
  const run = ++thumbRun;
  const queue = [...MODELS];
  const worker = async () => { while (queue.length && run === thumbRun) await makeThumb(queue.shift()); };
  await Promise.all([worker(), worker()]);
}

show(MODELS[0]).then(thumbQueue);
</script>
</body>
</html>
